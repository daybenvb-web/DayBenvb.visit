<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayBenvv</title>
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="style.css">
    <!-- Íconos de Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="intro" aria-hidden="true">
        <span class="intro-dot"></span>
    </div>

    <main class="container">
        <div class="card">
            <!-- Perfil -->
            <header class="profile">
                <div class="avatar">
                    <img src="img/FB_IMG_1765410475088.jpg" alt="Foto de perfil">
                </div>
                <h1>@DayBenvv</h1>
                <p class="bio">Desarrollador de Software & Creador Digital</p>
            </header>

            <!-- Lista de Redes Sociales -->
            <section class="links" aria-label="Redes sociales">
                <a href="https://www.instagram.com/dqyarwu/" target="_blank" rel="noopener noreferrer" class="link-btn link-instagram" aria-label="Instagram (abre en una pestaña nueva)">
                    <i class="fa-brands fa-instagram" aria-hidden="true"></i>
                    <span>Instagram</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external" aria-hidden="true"></i>
                </a>

                <a href="https://www.tiktok.com/@day_bena" target="_blank" rel="noopener noreferrer" class="link-btn link-tiktok" aria-label="TikTok (abre en una pestaña nueva)">
                    <i class="fa-brands fa-tiktok" aria-hidden="true"></i>
                    <span>TikTok</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external" aria-hidden="true"></i>
                </a>

                <a href="https://www.facebook.com/deyar.day.arean" target="_blank" rel="noopener noreferrer" class="link-btn link-facebook" aria-label="Facebook (abre en una pestaña nueva)">
                    <i class="fa-brands fa-facebook" aria-hidden="true"></i>
                    <span>Facebook</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external" aria-hidden="true"></i>
                </a>

                <a href="https://github.com/Daybenvv-code" target="_blank" rel="noopener noreferrer" class="link-btn link-github" aria-label="GitHub (abre en una pestaña nueva)">
                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                    <span>GitHub</span>
                    <i class="fa-solid fa-arrow-up-right-from-square external" aria-hidden="true"></i>
                </a>
            </section>
        </div>
    </main>

    <audio id="bgMusic" src="music/fondo.mp3" loop preload="auto"></audio>

    <button id="musicBtn" class="music-btn" type="button" aria-label="Reproducir música" aria-pressed="false" title="Reproducir música">
        <i class="fa-solid fa-music" aria-hidden="true"></i>
    </button>

    <script src="script.js"></script>
</body>
</html>
